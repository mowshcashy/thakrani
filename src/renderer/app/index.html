<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>ذكِّرني</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/base.css" />

<body>
  <div class="shell">
    <aside class="side">
      <div class="side-brand">
        <img class="logo-dark" src="../../../assets/logos/tha-dark.svg" alt="" />

        <span>ذكِّرنـي</span>

      <nav class="side-nav" id="nav">
        <button data-route="times" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/></svg>

        <button data-route="adhkar">

        <button data-route="quran">

      <div class="side-foot">
        <div id="sideNext" class="side-next"></div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script src="../shared/util.js"></script>
  <script src="app.js"></script>

</html>
