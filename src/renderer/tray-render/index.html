<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; media-src 'self' file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self';" />
  <title>خلفية ذكِّرني</title>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <style>
    html, body { margin: 0; background: transparent; }
    canvas { display: none; }
  </style>
</head>
<body>
  <canvas id="c" width="64" height="64"></canvas>
  <audio id="adhan" preload="none"></audio>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const SIZE = 64;

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function fitFont(c, text, maxWidth, startPx) {
      let px = startPx;
      c.font = `700 ${px}px "Thmanyah Sans", "Segoe UI", sans-serif`;
      while (c.measureText(text).width > maxWidth && px > 8) {
        px -= 1;
        c.font = `700 ${px}px "Thmanyah Sans", "Segoe UI", sans-serif`;
      }
      return px;
    }

    // شعار «ذكِّرني» الأبيض — يُرسم عند عدم وجود نص
    const logoImg = new Image();
    let logoReady = false;
    logoImg.onload = () => { logoReady = true; };
    logoImg.src = '../../../assets/logos/tha-dark.svg';

    function drawLogo(c) {
      if (logoReady) {
        const w = 42, h = 42 * (304.82 / 325.23);
        c.drawImage(logoImg, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      } else {
        // احتياط: هلال بسيط ريثما يُحمَّل الشعار
        c.save();
        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(SIZE / 2, SIZE / 2, 18, 0, Math.PI * 2);
        c.fill();
        c.globalCompositeOperation = 'destination-out';
        c.beginPath();
        c.arc(SIZE / 2 + 7, SIZE / 2 - 3, 16, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function render(spec) {
      ctx.clearRect(0, 0, SIZE, SIZE);

      // شارة خضراء (تظهر بوضوح على شريط مهام فاتح أو داكن)
      const grad = ctx.createLinearGradient(0, 0, 0, SIZE);
      grad.addColorStop(0, '#0e6b45');
      grad.addColorStop(1, '#0a4d31');
      ctx.fillStyle = grad;
      roundRect(ctx, 3, 3, SIZE - 6, SIZE - 6, 16);
      ctx.fill();

      const text = (spec && spec.text) ? String(spec.text) : '';
      if (!text) {
        drawLogo(ctx);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const px = fitFont(ctx, text, SIZE - 14, 30);
        ctx.font = `700 ${px}px "IBM Plex Sans Arabic", "Segoe UI", sans-serif`;
        ctx.fillText(text, SIZE / 2, SIZE / 2 + 1);
      }

      try {
        const url = canvas.toDataURL('image/png');
        window.zn.bg.sendTrayImage(url);
      } catch (e) { /* تجاهل */ }
    }

    function toFileUrl(p) {
      if (!p) return '';
      if (/^file:/i.test(p)) return p;
      let s = String(p).replace(/\\/g, '/');
      if (!s.startsWith('/')) s = '/' + s;
      return 'file://' + encodeURI(s).replace(/#/g, '%23');
    }

    const audio = document.getElementById('adhan');
    let adhanStopTimer = null;
    function playAdhan(opt) {
      try {
        clearTimeout(adhanStopTimer);
        audio.pause();
        audio.currentTime = 0;
        audio.src = toFileUrl(opt && opt.file);
        audio.volume = (opt && typeof opt.volume === 'number') ? Math.min(1, Math.max(0, opt.volume)) : 0.8;
        const pr = audio.play();
        if (pr && pr.catch) pr.catch((err) => console.warn('تعذّر تشغيل الأذان:', err && err.message));
        // «تكبيرات فقط»: أوقف الصوت عند الحدّ الأقصى (16 ثانية)
        if (opt && opt.maxMs > 0) {
          adhanStopTimer = setTimeout(() => { try { audio.pause(); } catch (_) {} }, opt.maxMs);
        }
      } catch (e) {
        console.warn('خطأ الأذان:', e.message);
      }
    }

    window.zn.bg.onTrayRender(render);
    window.zn.bg.onAdhanPlay(playAdhan);

    // انتظر تحميل الخط قبل إعلام الجاهزية لضمان رسم نصّ سليم
    (async () => {
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (_) {}
      window.zn.bg.ready();
    })();
  </script>
</body>
</html>
