name: بناء ونشر المثبِّت

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: تثبيت التبعيات
        run: npm ci
      - name: توليد الأصول
        run: npm run assets
      - name: بناء المثبِّت ونشره في Release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
